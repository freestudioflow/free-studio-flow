name: Validate

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_public_hygiene.py
      - run: python scripts/update_readme_after_publish.py --check-source-version
      - run: python -m pytest tests -m "not live" -v
      - run: python scripts/verify_clean_install.py
