[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "free-studio-flow"
version = "0.1.0rc7"
description = "AI-native film factory and Studio flows on top of ProDocuX contracts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "FSF Team" }]
keywords = ["film", "studio", "prodocux", "kaggle", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
  "prodocux==0.3.0rc7",
  "pdx-artifact-engine==0.3.0a8",
  "pdx-adapter-media==0.2.0a3",
  "python-docx==1.1.2",
  "Pillow>=10.4,<13",
  "kaggle>=1.6.17",
  "static-ffmpeg>=2.7",
]

[project.optional-dependencies]
api = ["boto3>=1.35,<2"]
credentials = ["keyring>=25,<26"]
dev = [
  "build>=1.2,<2",
  "setuptools>=77",
  "wheel>=0.45",
  "boto3>=1.35,<2",
  "pytest==8.3.4",
  "static-ffmpeg>=2.7",
]
media = [
  "static-ffmpeg>=2.7",
]

[project.scripts]
fsf = "fsf.cli.main:main"

[project.urls]
Homepage = "https://github.com/freestudioflow/free-studio-flow"
Repository = "https://github.com/freestudioflow/free-studio-flow"
Issues = "https://github.com/freestudioflow/free-studio-flow/issues"
Releases = "https://github.com/freestudioflow/free-studio-flow/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fsf.conformance" = ["*.schema.json"]
"fsf.schemas" = ["*.schema.json"]
"fsf.remote.templates" = ["*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: live Kaggle work + public API verification; local models are skipped",
]
